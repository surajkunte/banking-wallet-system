server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/customers/**

        - id: wallet-service
          uri: http://localhost:8083
          predicates:
            - Path=/wallets/**

        - id: ledger-service
          uri: http://localhost:8084
          predicates:
            - Path=/ledger/**

        - id: transfer-service
          uri: http://localhost:8085
          predicates:
            - Path=/transfers/**

        - id: kyc-service
          uri: http://localhost:8086
          predicates:
            - Path=/kyc/**

        - id: transaction-service
          uri: http://localhost:8087
          predicates:
            - Path=/transactions/**

        - id: fraud-service
          uri: http://localhost:8088
          predicates:
            - Path=/fraud/**

        - id: notification-service
          uri: http://localhost:8089
          predicates:
            - Path=/notifications/**

        - id: audit-service
          uri: http://localhost:8090
          predicates:
            - Path=/audit/**

        - id: reconciliation-service
          uri: http://localhost:8091
          predicates:
            - Path=/reconciliation/**
